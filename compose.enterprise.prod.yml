# Production docker-compose for Pi Enterprise Agent Platform
# Usage:
#   cp .env.enterprise.example .env.production  # edit with real secrets
#   docker compose -f compose.enterprise.prod.yml --env-file .env.production up -d

services:
  # ── PostgreSQL ────────────────────────────────────────────────────
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PI_POSTGRES_DB:-pi_enterprise}
      POSTGRES_USER: ${PI_POSTGRES_USER:-pi_enterprise}
      POSTGRES_PASSWORD: ${PI_POSTGRES_PASSWORD:?Set PI_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${PI_POSTGRES_PORT:-5432}:5432"
    volumes:
      - pi-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── MinIO (S3-compatible object storage) ──────────────────────────
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${PI_MINIO_ROOT_USER:?Set PI_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${PI_MINIO_ROOT_PASSWORD:?Set PI_MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${PI_MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${PI_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - pi-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── MinIO bootstrap (create bucket) ──────────────────────────────
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${PI_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${PI_MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${PI_MINIO_BUCKET:-pi-artifacts}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
        mc anonymous set none "local/$${MINIO_BUCKET}"
    restart: "no"

  # ── Pi Enterprise Web ────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # Auth
      PI_AUTH_MODE: ${PI_AUTH_MODE:-token}
      PI_AUTH_TOKEN: ${PI_AUTH_TOKEN:-}
      # OIDC (if PI_AUTH_MODE=oidc)
      PI_OIDC_ISSUER: ${PI_OIDC_ISSUER:-}
      PI_OIDC_AUDIENCE: ${PI_OIDC_AUDIENCE:-}
      # PostgreSQL
      PI_POSTGRES_URL: postgres://${PI_POSTGRES_USER:-pi_enterprise}:${PI_POSTGRES_PASSWORD}@postgres:5432/${PI_POSTGRES_DB:-pi_enterprise}
      # MinIO
      PI_MINIO_ENDPOINT: http://minio:9000
      PI_MINIO_ROOT_USER: ${PI_MINIO_ROOT_USER}
      PI_MINIO_ROOT_PASSWORD: ${PI_MINIO_ROOT_PASSWORD}
      PI_MINIO_BUCKET: ${PI_MINIO_BUCKET:-pi-artifacts}
      # Worker config
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    ports:
      - "${PI_APP_PORT:-30141}:30141"

volumes:
  pi-postgres-data:
  pi-minio-data:
